<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryForge Shorts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f0f0f0; background: #1a1025; min-height: 100vh; display: flex; flex-direction: column; }
        nav { background: #2D1B69; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }

        nav .links a:hover { color: #FF6B35; }
        .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3rem 1.5rem; }
        .hero h1 { font-size: 2.5rem; color: #FF6B35; margin-bottom: 1rem; }
        .hero p { font-size: 1.15rem; max-width: 540px; line-height: 1.6; color: #bbb; }
        .hero .yt { display: inline-block; margin-top: 2rem; padding: 0.75rem 2rem; background: #FF6B35; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .hero .yt:hover { background: #e55a2b; }
        footer { text-align: center; padding: 1.5rem; font-size: 0.8rem; color: #666; }
        footer a { color: #888; text-decoration: none; }
        footer a:hover { color: #FF6B35; }
    </style>
</head>

    <nav>
        <a href="/storyforgesshorts.com/" class="brand">StoryForge Shorts</a>

    <footer>
